<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-glow.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-glow.png" />
    <link rel="apple-touch-icon" href="/favicon-glow.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Préchargement de la photo de bambous (commune à toutes les pages) : mêmes tailles que BambooPhoto.tsx.
         imagesrcset + imagesizes : le navigateur ne télécharge QUE la taille adaptée à l'écran. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      fetchpriority="high"
      media="(min-width: 1024px)"
      imagesrcset="%BASE_URL%assets/images/hero-bamboo-1200.webp 1200w, %BASE_URL%assets/images/hero-bamboo-1920.webp 1920w, %BASE_URL%assets/images/hero-bamboo.webp 2400w"
      imagesizes="145vw"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      fetchpriority="high"
      media="(max-width: 1023.98px)"
      imagesrcset="%BASE_URL%assets/images/hero-bamboo-1200.webp 1200w, %BASE_URL%assets/images/hero-bamboo-1920.webp 1920w, %BASE_URL%assets/images/hero-bamboo.webp 2400w"
      imagesizes="100vw"
    />
    <script>
      // Pose le thème avant le premier affichage (évite un flash sombre). Même logique que app/providers.tsx.
      (function () {
        var theme = 'light';
        try {
          var stored = localStorage.getItem('portfolio-theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta
      name="description"
      content="Aurel Vehi, applied economist and PhD researcher (ESTIA, University of Bordeaux): turning fragmented economic data into comparable indicators, econometric analysis and decision support."
    />
    <meta name="author" content="Aurel Vehi" />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://aurvl.github.io/portfolio/" />
    <meta property="og:title" content="Aurel Vehi | Applied Economist and PhD Researcher" />
    <meta
      property="og:description"
      content="Aurel Vehi, applied economist and PhD researcher (ESTIA, University of Bordeaux): turning fragmented economic data into comparable indicators, econometric analysis and decision support."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aurvl.github.io/portfolio/" />
    <meta property="og:image" content="https://aurvl.github.io/portfolio/assets/images/hero-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Aurel Vehi | Applied Economist and PhD Researcher</title>
    <script>
      (function(locationData) {
        if (!locationData.search || locationData.search[1] !== '/') {
          return;
        }

        var decoded = locationData.search
          .slice(1)
          .split('&')
          .map(function(segment) {
            return segment.replace(/~and~/g, '&');
          })
          .join('?');
        var nextPath = decoded.slice(1) || '/';

        window.history.replaceState(
          null,
          '',
          nextPath + locationData.hash
        );
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
