<svg width="720" height="720" viewBox="120 130 720 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Monogramme AV, arcs derrière les barres</title>
  <desc id="desc">Les portions des arcs intérieurs sont masquées par les barres blanches du A et du V. Les contours bleu nuit restent visibles autour des barres et la traverse du A est blanche et continue.</desc>

  <!-- Le montant central reste derrière les arcs qui le rejoignent. -->
  <rect x="407" y="179" width="150" height="637" fill="#FFFFFF"/>
  <g fill="none" stroke="#10275F" stroke-width="26" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M228 630C254 443 364 281 538 281"/>
  </g>

  <!-- Les deux barres latérales recouvrent les portions encerclées. -->
  <g fill="#FFFFFF">
    <rect x="157" y="263" width="150" height="530"/>
    <rect x="657" y="154" width="150" height="579"/>
  </g>

  <!-- Le contour droit et l'arc interieur forment une seule courbe continue. -->
  <path d="M671 154V526C671 549 665 560 657 571C603 643 522 693 421 708"
        fill="none" stroke="#10275F" stroke-width="28" stroke-linecap="butt" stroke-linejoin="round"/>

  <!-- Les grands contours restent au premier plan. -->
  <g fill="none" stroke="#10275F" stroke-width="26" stroke-linecap="butt" stroke-linejoin="round">
    <path d="M557 179H482C320 179 171 286 171 420V793"/>
    <path d="M793 463C793 643 664 797 421 803"/>
  </g>

  <g fill="#10275F">
    <rect x="157" y="793" width="150" height="32"/>
    <rect x="535" y="166" width="22" height="318"/>
    <rect x="407" y="311" width="28" height="505"/>
    <rect x="657" y="154" width="150" height="29"/>
    <rect x="779" y="154" width="28" height="309"/>
  </g>

  <!-- La traverse blanche cache le montant bleu nuit à son passage. -->
  <rect x="307" y="512" width="277" height="78" fill="#FFFFFF"/>
  <g fill="#10275F">
    <rect x="306" y="483" width="278" height="29"/>
    <rect x="306" y="590" width="278" height="29"/>
    <rect x="279" y="483" width="28" height="310"/>
  </g>
</svg>
