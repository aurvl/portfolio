<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex,follow" />
    <link rel="canonical" href="https://aurvl.github.io/portfolio/projects" />
    <title>Redirecting...</title>
    <script>
      (function() {
        var target = window.location.pathname.replace(/blog[/]?$/, 'projects');
        window.location.replace(target + window.location.search + '#blog');
      })();
    </script>
  </head>
  <body>
    <p>The blog moved to <a href="https://aurvl.github.io/portfolio/projects#blog">https://aurvl.github.io/portfolio/projects#blog</a>.</p>
  </body>
</html>
